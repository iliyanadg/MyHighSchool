name: M127 native EA lesson timing Mac experiment
on:
  push:
    branches:
      - feature/m55-presenze-studente-test
    paths:
      - 'src/m127_timing/**'
      - 'tests/test_m127_*.py'
      - 'tooling/build_mhs127_verified.py'
      - '.github/workflows/m127-native-timing-mac.yml'
  workflow_dispatch:
jobs:
  validate_build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.7'
      - name: Test native timing plus all earlier school regressions
        run: python -m unittest tests.test_m127_school_timing_readback tests.test_m126_early_preparation_projection tests.test_m126_early_school_integration tests.test_m125_safe_recovery tests.test_m124_lesson_action_readback tests.test_m123_lesson_guest_projection tests.test_m121_thirteen_npc_trial tests.test_m122_classroom_job_readback -v
      - name: Build M127 Mac with real controller entrypoint
        run: python -m tooling.build_mhs127_verified dist_m127
      - name: Assert archive has M127 command registrations and timing observer
        run: |
          python - <<'PY'
          from tooling.build_mhs127_verified import SOURCES,MAGIC,NAME
          from zipfile import ZipFile
          with ZipFile('dist_m127/'+NAME) as z:
              assert len(z.namelist()) == len(SOURCES) == 13
              assert all(z.read(x)[:4] == MAGIC for x in z.namelist())
              assert 'mhs127_timed_school_controller.pyc' in z.namelist()
              assert 'mhs127_school_timing_readback.pyc' in z.namelist()
              assert 'mhs126_early_school_controller.pyc' not in z.namelist()
              script=z.read('mhs127_timed_school_controller.pyc')
              for name in ('mhs127.arm','mhs127.tempo','mhs127.status','mhs127.stop'):
                  assert name.encode('utf-8') in script,name
          print('M127 Mac commands and timing module validated')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: MHS_M127_NATIVE_TIMING_MAC_EXPERIMENTAL
          path: |
            dist_m127/MHS_M127_ORARI_PERCORSI_MAC_BETA.ts4script
            dist_m127/M127_BUILD_REPORT.json
            dist_m127/LEGGIMI_M127.txt
          if-no-files-found: error
