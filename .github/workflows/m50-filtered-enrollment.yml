name: M50 filter enrolled teens and cap native picker to free seats
on:
  workflow_dispatch:
  push:
    paths:
      - 'src/m48_enrollment/mhs48_single_picker.py'
      - 'src/m2_registry/mhs46_enrollment_transaction.py'
      - 'tooling/build_m50_filtered_cap.py'
      - 'tests/test_m48_one_step_enrollment.py'
      - 'tests/test_m49_picker_strategy.py'
      - 'tests/test_m50_enrollment_filter.py'
      - '.github/workflows/m50-filtered-enrollment.yml'
jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.7'
      - name: Full Python regression suite
        run: python -m unittest discover -s tests -v
      - name: Package M50 unchanged M49 menu and new filtered UI
        run: python -m tooling.build_m50_filtered_cap dist/
      - name: Verify package structure and script bytecode
        run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile
          from tooling.build_m50_filtered_cap import package_bytes
          from tooling.simdata_release_gate import inspect_bytes
          p=Path('dist/MHS_M50_ISCRIZIONI_FILTRATE_LIMITE_POSTI_TEST.package')
          s=Path('dist/MHS_M50_ISCRIZIONI_FILTRATE_LIMITE_POSTI_TEST.ts4script')
          assert p.read_bytes()==package_bytes()
          info=inspect_bytes(p.read_bytes())
          assert info['status']=='STATIC_GATE_PASSED'
          assert info['category_count']==5 and info['simdata_count']==5
          with zipfile.ZipFile(s) as z:
              assert len(z.namelist())==17
              assert all(z.read(n)[:4]==bytes((66,13,13,10)) for n in z.namelist())
          print('M50 static checks passed; Mac in-game validation pending')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: MHS_M50_ISCRIZIONI_FILTRATE_MAX_POSTI_MAC_TEST
          path: |
            dist/MHS_M50_ISCRIZIONI_FILTRATE_LIMITE_POSTI_TEST.package
            dist/MHS_M50_ISCRIZIONI_FILTRATE_LIMITE_POSTI_TEST.ts4script
          if-no-files-found: error
