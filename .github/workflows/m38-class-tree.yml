name: M38 full nested class tree offline (Python 3.7)
on:
  workflow_dispatch:
  push:
    paths:
      - "tooling/build_m38_three_class_menu.py"
      - "tests/test_m38_three_class_menu.py"
      - ".github/workflows/m38-class-tree.yml"

jobs:
  test-build:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.7"
      - name: Full offline test suite
        run: python -m unittest discover -s tests -v
      - name: Build experimental M38 full class tree
        run: python -m tooling.build_m38_three_class_menu dist/
      - name: Validate Python bytecode and package resources
        run: |
          python - <<'PY'
          from pathlib import Path
          from tooling.simdata_release_gate import inspect_bytes
          import zipfile
          p=Path('dist/MHS_M38_MENU_CLASSI_COMPLETO_TEST.package')
          s=Path('dist/MHS_M38_MENU_CLASSI_COMPLETO_TEST.ts4script')
          a=inspect_bytes(p.read_bytes())
          assert a['status']=='STATIC_GATE_PASSED'
          assert a['category_count']==5 and a['simdata_count']==5
          with zipfile.ZipFile(s) as z:
              assert len(z.namelist())==13
              assert all(z.read(x)[:4]==bytes((66,13,13,10)) for x in z.namelist())
          print('M38 structure assembled but runtime not yet verified.')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: MHS_M38_ALBERO_COMPLETO_NON_TESTATO
          path: |
            dist/MHS_M38_MENU_CLASSI_COMPLETO_TEST.package
            dist/MHS_M38_MENU_CLASSI_COMPLETO_TEST.ts4script
          if-no-files-found: error
