name: M123 original EA 2x8 lesson guest experiment Mac
on:
  push:
    branches:
      - feature/m55-presenze-studente-test
    paths:
      - 'src/m123_class_repair/**'
      - 'tests/test_m123_*.py'
      - 'tooling/build_mhs123_beta.py'
      - '.github/workflows/m123-class-repair-mac.yml'
  workflow_dispatch:
jobs:
  test_and_build:
    name: M123 13 native school NPCs + two class guest projection (Python 3.7)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.7'
      - name: Run M123 projection, integration, M122 readback and M121 school regression
        run: python -m unittest tests.test_m123_lesson_guest_projection tests.test_m123_live_lesson_integration tests.test_m122_classroom_job_readback tests.test_m121_thirteen_npc_trial -v
      - name: Build one Mac beta
        run: python -m tooling.build_mhs123_beta dist_m123
      - name: Check script contains nine Python 3.7 modules
        run: |
          python - <<'PY'
          from tooling.build_mhs123_beta import SOURCES,MAGIC,NAME
          from zipfile import ZipFile
          with ZipFile('dist_m123/'+NAME) as z:
              assert len(z.namelist())==len(SOURCES)==9
              assert set(z.namelist())==set(s.stem+'.pyc' for s in SOURCES)
              assert all(z.read(p)[:4]==MAGIC for p in z.namelist())
          print('M123 Mac beta compiled; gameplay lesson selection still unverified')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: MHS_M123_TWO_CLASSROOM_MAC_EXPERIMENTAL
          path: |
            dist_m123/MHS_M123_DUE_AULE_MAC_BETA.ts4script
            dist_m123/M123_BUILD_REPORT.json
            dist_m123/LEGGIMI_M123.txt
          if-no-files-found: error
