name: M137 Zerbu Class2 playable compatibility Mac
on:
  push:
    branches: [feature/m55-presenze-studente-test]
    paths:
      - 'src/m137_zerbu/**'
      - 'tests/test_m137_*.py'
      - 'tooling/build_mhs137_verified.py'
      - '.github/workflows/m137-zerbu-class2-mac.yml'
  workflow_dispatch:
jobs:
  validate_build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.7'
      - name: Offline regression tests (NOT game proof)
        run: python -m unittest tests.test_m137_zerbu_board_compat tests.test_m136_player_test_hierarchy tests.test_m134_native_player_job_audit tests.test_m132_native_player_test_audit tests.test_m131_native_playable_class tests.test_m130_physical_seat_audit tests.test_m128_trait_alignment tests.test_m128_board_posture_audit tests.test_m127_school_timing_readback tests.test_m126_early_preparation_projection tests.test_m126_early_school_integration tests.test_m125_safe_recovery tests.test_m124_lesson_action_readback tests.test_m123_lesson_guest_projection tests.test_m121_thirteen_npc_trial tests.test_m122_classroom_job_readback -v
      - name: Build Mac Python 3.7
        run: python -m tooling.build_mhs137_verified dist_m137
      - name: Verify packaged M137 compatibility test branch
        run: |
          python - <<'PY'
          from tooling.build_mhs137_verified import SOURCES,MAGIC,NAME
          from zipfile import ZipFile
          with ZipFile('dist_m137/'+NAME) as z:
              assert len(z.namelist()) == len(SOURCES) == 21
              assert all(z.read(f)[:4] == MAGIC for f in z.namelist())
              assert 'mhs137_classroom_controller.pyc' in z.namelist()
              assert 'mhs137_zerbu_board_compat.pyc' in z.namelist()
              assert 'mhs136_classroom_controller.pyc' not in z.namelist()
              script=z.read('mhs137_classroom_controller.pyc')
              for name in ('mhs137.arm','mhs137.sync','mhs137.compat','mhs137.stop'):
                  assert name.encode() in script,name
          print('M137 Mac Zerbu scoped Class2 beta packaged; real game not validated')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: MHS_M137_ZERBU_CLASS2_COMPAT_MAC_EXPERIMENTAL
          path: |
            dist_m137/MHS_M137_COMPAT_ZERBU_LAVAGNA2_MAC_BETA.ts4script
            dist_m137/M137_BUILD_REPORT.json
            dist_m137/LEGGIMI_M137.txt
          if-no-files-found: error
