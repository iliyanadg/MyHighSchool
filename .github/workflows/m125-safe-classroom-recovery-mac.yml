name: M125 one shot native lesson recovery Mac test
on:
  push:
    branches:
      - feature/m55-presenze-studente-test
    paths:
      - 'src/m125_recovery/**'
      - 'tests/test_m125_safe_recovery.py'
      - 'tooling/build_mhs125_beta.py'
      - '.github/workflows/m125-safe-classroom-recovery-mac.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.7'
      - name: Run M125 selective original EA interaction and school regressions
        run: python -m unittest tests.test_m125_safe_recovery tests.test_m124_lesson_action_readback tests.test_m123_live_lesson_integration tests.test_m123_lesson_guest_projection tests.test_m121_thirteen_npc_trial tests.test_m122_classroom_job_readback -v
      - name: Build M125 Mac Python 3.7 beta
        run: python -m tooling.build_mhs125_beta dist_m125
      - name: Validate archive and actual M125 command signatures
        run: |
          python - <<'PY'
          from tooling.build_mhs125_beta import SOURCES,MAGIC,NAME
          from zipfile import ZipFile
          with ZipFile('dist_m125/'+NAME) as z:
              assert len(z.namelist()) == len(SOURCES) == 11
              assert set(z.namelist()) == set(p.stem+'.pyc' for p in SOURCES)
              assert all(z.read(x)[:4] == MAGIC for x in z.namelist())
              assert 'mhs125_thirteen_npc_plus_recovery.pyc' in z.namelist()
              assert 'mhs125_safe_recovery.pyc' in z.namelist()
              assert 'mhs124_thirteen_npc_plus_behavior.pyc' not in z.namelist()
              commands=z.read('mhs125_thirteen_npc_plus_recovery.pyc')
              for name in ('mhs125.arm','mhs125.candidati',
                           'mhs125.rientro','mhs125.classi','mhs125.stop'):
                  assert name.encode() in commands,name
          print('M125 contains genuine beta command handlers')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: MHS_M125_ONE_SHOT_CLASSROOM_RECOVERY_MAC_EXPERIMENTAL
          path: |
            dist_m125/MHS_M125_RECUPERO_AULA_MAC_BETA.ts4script
            dist_m125/M125_BUILD_REPORT.json
            dist_m125/LEGGIMI_M125.txt
          if-no-files-found: error
