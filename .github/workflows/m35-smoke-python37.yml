name: M35 single category registration smoke (Python 3.7)
on:
  workflow_dispatch:
  push:
    paths:
      - "tooling/build_m35_category_smoke.py"
      - "tests/test_m35_category_smoke.py"
      - ".github/workflows/m35-smoke-python37.yml"

jobs:
  smoke-build:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.7"
      - name: Run full repository tests including M35
        run: python -m unittest discover -s tests -v
      - name: Compile M35 one-category test pair
        run: python -m tooling.build_m35_category_smoke dist/
      - name: Confirm only one additional category and unchanged pyc modules
        run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile
          from tooling.build_m35_category_smoke import package_bytes
          from tooling.build_m34_settings import package_bytes as m34
          from tooling.simdata_release_gate import resources,inspect_bytes
          p=Path('dist/MHS_M35_SMOKE_CATEGORIA1_TEST.package')
          s=Path('dist/MHS_M35_SMOKE_CATEGORIA1_TEST.ts4script')
          info=inspect_bytes(p.read_bytes())
          assert info['status']=='STATIC_GATE_PASSED'
          assert info['category_count']==2 and info['simdata_count']==2
          assert len(resources(p.read_bytes()))==len(resources(m34()))+2
          with zipfile.ZipFile(s) as z:
              assert len(z.namelist())==13
              assert all(z.read(x)[:4]==bytes((66,13,13,10)) for x in z.namelist())
          print('M35 static checks passed. DO NOT claim in-game compatibility.')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: MHS_M35_SOLO_TEST_REGISTRAZIONE_CLASSE1
          path: |
            dist/MHS_M35_SMOKE_CATEGORIA1_TEST.package
            dist/MHS_M35_SMOKE_CATEGORIA1_TEST.ts4script
          if-no-files-found: error
