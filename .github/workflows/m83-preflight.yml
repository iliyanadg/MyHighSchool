name: M83 current Mac compatibility preflight (offline only)
on:
  workflow_dispatch:
  push:
    branches:
      - feature/m55-presenze-studente-test
    paths:
      - 'src/m83_compatibility/**'
      - 'tests/test_m83_preflight.py'
      - '.github/workflows/m83-preflight.yml'
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.7'
      - name: Validate no runtime mutation or older-mod assumptions
        run: python -m unittest tests.test_m83_preflight -v
      - name: Python 3.7 static compile
        run: python -m py_compile src/m83_compatibility/mhs83_preflight.py
