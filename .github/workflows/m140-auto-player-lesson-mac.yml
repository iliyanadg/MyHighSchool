name: M140 playable auto lesson entry Mac
on:
  push:
    branches: [feature/m55-presenze-studente-test]
    paths:
      - 'src/m140_auto_lesson/**'
      - 'tests/test_m140_*.py'
      - 'tooling/build_mhs140_verified.py'
      - '.github/workflows/m140-auto-player-lesson-mac.yml'
  workflow_dispatch:
jobs:
  validate_build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.7'
      - name: Offline original EA lesson auto-entry plus past school regressions
        run: python -m unittest tests.test_m140_native_lesson_entry tests.test_m139_ea_zerbu_adapter tests.test_m138_exclusive_whiteboard tests.test_m137_zerbu_board_compat tests.test_m136_player_test_hierarchy tests.test_m134_native_player_job_audit tests.test_m132_native_player_test_audit tests.test_m131_native_playable_class tests.test_m130_physical_seat_audit tests.test_m128_trait_alignment tests.test_m128_board_posture_audit tests.test_m127_school_timing_readback tests.test_m126_early_preparation_projection tests.test_m126_early_school_integration tests.test_m125_safe_recovery tests.test_m124_lesson_action_readback tests.test_m123_lesson_guest_projection tests.test_m121_thirteen_npc_trial tests.test_m122_classroom_job_readback -v
      - name: Build Python 3.7 Mac experimental archive
        run: python -m tooling.build_mhs140_verified dist_m140
      - name: Inspect M140 bytecode archive
        run: |
          python - <<'PY'
          from tooling.build_mhs140_verified import SOURCES,MAGIC,NAME
          from zipfile import ZipFile
          with ZipFile('dist_m140/'+NAME) as z:
              assert len(z.namelist()) == len(SOURCES) == 22
              assert all(z.read(f)[:4] == MAGIC for f in z.namelist())
              assert 'mhs140_classroom_controller.pyc' in z.namelist()
              assert 'mhs140_native_lesson_entry.pyc' in z.namelist()
              assert 'mhs139_ea_zerbu_adapter.pyc' in z.namelist()
              assert 'mhs139_classroom_controller.pyc' not in z.namelist()
              script=z.read('mhs140_classroom_controller.pyc')
              for cmd in ('mhs140.arm','mhs140.compat','mhs140.auto','mhs140.stop'):
                  assert cmd.encode() in script,cmd
          print('M140 Mac player original EA lesson auto-entry beta packaged; NOT validated in game')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: MHS_M140_PLAYER_AUTO_LESSON_MAC_EXPERIMENTAL
          path: |
            dist_m140/MHS_M140_AUTO_LEZIONI_GIOCABILI_MAC_BETA.ts4script
            dist_m140/M140_BUILD_REPORT.json
            dist_m140/LEGGIMI_M140.txt
          if-no-files-found: error
