name: M31 cumulative class submenus and picker fix (Python 3.7)
on:
  workflow_dispatch:
  push:
    paths:
      - "src/m27_remove_ui/**"
      - "src/m29_registry/**"
      - "tooling/build_m31_nested_picker_fix.py"
      - "tests/test_m27_remove_ui.py"
      - ".github/workflows/m31-python37.yml"

jobs:
  test-and-build:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.7"
      - name: Run all offline tests
        run: python -m unittest discover -s tests -v
      - name: Compile cumulative M31 files
        run: python -m tooling.build_m31_nested_picker_fix dist/
      - name: Check bundle
        run: |
          python - <<'PY'
          from pathlib import Path
          from tooling.simdata_release_gate import resources, inspect_bytes
          import zipfile
          p=Path('dist/MHS_M31_SOTTOMENU_PICKER_FIX_TEST.package')
          s=Path('dist/MHS_M31_SOTTOMENU_PICKER_FIX_TEST.ts4script')
          report=inspect_bytes(p.read_bytes())
          assert len(resources(p.read_bytes()))==23
          assert report['category_count']==4 and report['simdata_count']==4
          with zipfile.ZipFile(s) as z:
              assert len(z.namelist())==9
              assert all(z.read(n)[:4]==bytes((66,13,13,10)) for n in z.namelist())
          print('M31 offline checks passed; game runtime unverified')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: MHS_M31_MENU_CLASSI_PICKER_FIX_SOLO_TEST
          path: |
            dist/MHS_M31_SOTTOMENU_PICKER_FIX_TEST.package
            dist/MHS_M31_SOTTOMENU_PICKER_FIX_TEST.ts4script
          if-no-files-found: error
