name: M32 class menu transfers (Python 3.7)
on:
  workflow_dispatch:
  push:
    paths:
      - "src/m32_transfer/**"
      - "tooling/build_m32_transfer.py"
      - "tests/test_m32_transfer.py"
      - ".github/workflows/m32-python37.yml"

jobs:
  build-and-test:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.7"
      - name: Run complete offline suite
        run: python -m unittest discover -s tests -v
      - name: Build M32 cumulative files
        run: python -m tooling.build_m32_transfer dist/
      - name: Verify resource structure and scripts
        run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile
          from tooling.simdata_release_gate import resources,inspect_bytes
          p=Path('dist/MHS_M32_SOTTOMENU_TRASFERIMENTI_TEST.package')
          s=Path('dist/MHS_M32_SOTTOMENU_TRASFERIMENTI_TEST.ts4script')
          info=inspect_bytes(p.read_bytes())
          assert len(resources(p.read_bytes()))==29
          assert info['status']=='STATIC_GATE_PASSED'
          assert info['category_count']==4 and info['simdata_count']==4
          with zipfile.ZipFile(str(s)) as z:
              assert len(z.namelist())==10
              assert all(z.read(f)[:4]==bytes((66,13,13,10)) for f in z.namelist())
          print('M32: static checks passed. In-game Mac test not completed.')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: MHS_M32_CLASSI_TRASFERIMENTI_SOLO_TEST
          path: |
            dist/MHS_M32_SOTTOMENU_TRASFERIMENTI_TEST.package
            dist/MHS_M32_SOTTOMENU_TRASFERIMENTI_TEST.ts4script
          if-no-files-found: error
