name: M132 native player test rejection reason Mac
on:
  push:
    branches:
      - feature/m55-presenze-studente-test
    paths:
      - 'src/m132_player_diagnosis/**'
      - 'tests/test_m132_*.py'
      - 'tooling/build_mhs132_verified.py'
      - '.github/workflows/m132-native-rejection-mac.yml'
  workflow_dispatch:
jobs:
  validate_build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.7'
      - name: Test native player rejection analysis and all earlier school regressions
        run: python -m unittest tests.test_m132_native_player_test_audit tests.test_m131_native_playable_class tests.test_m130_physical_seat_audit tests.test_m128_trait_alignment tests.test_m128_board_posture_audit tests.test_m127_school_timing_readback tests.test_m126_early_preparation_projection tests.test_m126_early_school_integration tests.test_m125_safe_recovery tests.test_m124_lesson_action_readback tests.test_m123_lesson_guest_projection tests.test_m121_thirteen_npc_trial tests.test_m122_classroom_job_readback -v
      - name: Build Mac Python 3.7 archive
        run: python -m tooling.build_mhs132_verified dist_m132
      - name: Validate M132 player diagnostic in the Mac archive
        run: |
          python - <<'PY'
          from tooling.build_mhs132_verified import SOURCES,MAGIC,NAME
          from zipfile import ZipFile
          with ZipFile('dist_m132/'+NAME) as z:
              assert len(z.namelist()) == len(SOURCES) == 18
              assert all(z.read(f)[:4] == MAGIC for f in z.namelist())
              assert 'mhs132_classroom_controller.pyc' in z.namelist()
              assert 'mhs132_native_player_test_audit.pyc' in z.namelist()
              assert 'mhs131_classroom_controller.pyc' not in z.namelist()
              script=z.read('mhs132_classroom_controller.pyc')
              for command in ('mhs132.arm','mhs132.verifica','mhs132.giocabili','mhs132.causa','mhs132.sync','mhs132.stop'):
                  assert command.encode('utf-8') in script,command
          print('M132 native EA test rejection diagnostic Mac verified')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: MHS_M132_EA_PLAYER_REJECTION_DIAGNOSTIC_MAC_EXPERIMENTAL
          path: |
            dist_m132/MHS_M132_CAUSA_RIFIUTO_GIOCABILI_MAC_BETA.ts4script
            dist_m132/M132_BUILD_REPORT.json
            dist_m132/LEGGIMI_M132.txt
          if-no-files-found: error
