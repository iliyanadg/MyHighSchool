        run: python -m unittest tests.test_m94_job_probe -v
      - name: Build M94 Mac diagnostic archive
        run: python -m tooling.build_mhs94_probe dist_m94/
      - name: Verify preserved M85 tuning and Python 3.7 bytecode
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          from tooling.simdata_release_gate import inspect_bytes
          p=Path('dist_m94/MHS_M94_FILTRI_LICEO_MAC_SOLA_LETTURA.package')
          z=Path('dist_m94/MHS_M94_FILTRI_LICEO_MAC_SOLA_LETTURA.ts4script')
          assert inspect_bytes(p.read_bytes())['resource_count']==63
          with ZipFile(str(z)) as archive:
              names=archive.namelist()
              assert len(names)==33
              assert 'mhs94_school_job_probe.pyc' in names
              assert all(archive.read(n)[:4]==bytes((66,13,13,10)) for n in names)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: MHS_M94_FILTRI_LICEO_MAC_SOLA_LETTURA
