        run: python -m tooling.build_mhs106_pilot dist_m106/
      - name: Verify M106 53 compiled modules and archive safety flags
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from zipfile import ZipFile
          from tooling.build_mhs106_pilot import PACKAGE,SCRIPT,ZIP,REPORT
          folder=Path('dist_m106')
          report=json.loads((folder/REPORT).read_text())
          assert report['compiled_python37_modules']==53
          assert report['package_resources']==76
          assert report['release_ready'] is False
          assert report['full_16_attendance_verified'] is False
          assert report['ea_base_schedule_count_override_enabled'] is False
          with ZipFile(str(folder/SCRIPT)) as script:
              names=script.namelist()
              assert len(names)==53
              assert 'mhs106_game_controller.pyc' in names
              assert 'mhs106_school_session.pyc' in names
              assert 'mhs106_roster_first_policy.pyc' in names
              assert all(script.read(n)[:4]==bytes((66,13,13,10))
                         for n in names)
          with ZipFile(str(folder/ZIP)) as bundle:
              assert set(bundle.namelist())=={
                  PACKAGE,SCRIPT,REPORT,'LEGGIMI_M106_PILOT.txt'}
          print('M106 native Mac pilot compile passed; gameplay unverified')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: MHS_M106_ROSTER_FIRST_MAC_PILOT_NON_VALIDATO_IN_GIOCO
