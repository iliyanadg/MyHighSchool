    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.7'
      - name: Validate M106 fixed roster and native request delegation
        run: python -m unittest tests.test_m106_roster_first_policy tests.test_m106_bridge_arguments tests.test_m106_live_preflight tests.test_m106_school_session tests.test_m106_game_connector tests.test_m106_pilot_release tests.test_m106_fixed_roster_audit -v
