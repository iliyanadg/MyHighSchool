name: M148 low-impact dual clock diagnostics Mac
on:
  push:
    branches: [feature/m148-dual-clock-low-impact]
    paths:
      - 'src/m145_class2_playable/**'
      - 'src/m147_integrated/**'
      - 'src/m148_clock/**'
      - 'src/m131_playable/**'
      - 'tests/test_m145_*.py'
      - 'tests/test_m147_*.py'
      - 'tests/test_m148_*.py'
      - 'tests/test_m131_native_playable_class.py'
      - 'tooling/build_mhs148_verified.py'
      - '.github/workflows/m148-low-impact-dual-clock-mac.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.7'
      - name: Test original EA subject selector patch and all school regressions
        run: |
          python -m unittest tests.test_m148_clocks_and_sampling tests.test_m147_native_roles tests.test_m146_class_timing_policy tests.test_m145_subject_picker_patch tests.test_m143_native_attendance_and_lunch tests.test_m142_two_periods_and_lunch tests.test_m141_day_trace tests.test_m140_native_lesson_entry tests.test_m139_ea_zerbu_adapter tests.test_m138_exclusive_whiteboard tests.test_m137_zerbu_board_compat tests.test_m131_native_playable_class tests.test_m130_physical_seat_audit -v
      - name: Build standalone Python 3.7 Mac .ts4script
        run: python -m tooling.build_mhs148_verified dist_m148
      - name: Check archive contents and M148 menu
        run: |
          python - <<'PY'
          from tooling.build_mhs148_verified import SOURCES,MAGIC,NAME
          from zipfile import ZipFile
          with ZipFile('dist_m148/'+NAME) as z:
              names=z.namelist()
              assert len(names)==len(SOURCES)==28,(len(names),len(SOURCES))
              assert len(set(names))==28
              assert all(z.read(f)[:4]==MAGIC for f in names)
              for f in ('mhs145_classroom_controller.pyc',
                         'mhs147_class_timing_policy.pyc',
                         'mhs148_clock_and_sampling.pyc',
                         'mhs148_day_trace.pyc',
                         'mhs145_subject_picker_patch.pyc',
                         'mhs143_native_attendance_policy.pyc',
                         'mhs140_native_lesson_entry.pyc'):
                  assert f in names,f
              assert 'mhs143_classroom_controller.pyc' not in names
              code=z.read('mhs145_classroom_controller.pyc')
              for cmd in ('mhs148.arm','mhs148.monitor','mhs148.report',
                          'mhs148.compat','mhs148.stop','mhs148.clock'):
                  assert cmd.encode() in code,cmd
          print('M148 two-clock Mac beta offline validated. In-game still required.')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: MHS_M148_LOW_IMPACT_DUAL_CLOCK_MAC_BETA
          path: |
            dist_m148/MHS_M148_DOPPIO_OROLOGIO_MAC_BETA.ts4script
            dist_m148/M148_BUILD_REPORT.json
            dist_m148/LEGGIMI_M148.txt
          if-no-files-found: error
