name: M40 root-child noncollapsible menu (Python 3.7)
on:
  workflow_dispatch:
  push:
    paths:
      - "tooling/build_m40_noncollapsible_parent.py"
      - "tests/test_m40_noncollapsible_parent.py"
      - ".github/workflows/m40-noncollapsible.yml"

jobs:
  test-and-build:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.7"
      - name: All offline regression tests
        run: python -m unittest discover -s tests -v
      - name: Build M40 paired category tuning
        run: python -m tooling.build_m40_noncollapsible_parent dist/
      - name: Check package and TS4 Python 3.7 bytecode
        run: |
          python - <<'PY'
          from pathlib import Path
          from tooling.simdata_release_gate import inspect_bytes
          import zipfile
          p=Path('dist/MHS_M40_MENU_GERARCHICO_COLLAPSIBLE_FALSE_TEST.package')
          s=Path('dist/MHS_M40_MENU_GERARCHICO_COLLAPSIBLE_FALSE_TEST.ts4script')
          data=inspect_bytes(p.read_bytes())
          assert data['status']=='STATIC_GATE_PASSED'
          assert data['category_count']==2
          assert data['simdata_count']==2
          with zipfile.ZipFile(s) as zipf:
              assert len(zipf.namelist())==13
              assert all(zipf.read(n)[:4]==bytes((66,13,13,10)) for n in zipf.namelist())
          print('Static M40 checks OK; in-game category layout not yet validated')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: MHS_M40_MENU_COLLAPSIBLE_FALSE_SOLO_TEST
          path: |
            dist/MHS_M40_MENU_GERARCHICO_COLLAPSIBLE_FALSE_TEST.package
            dist/MHS_M40_MENU_GERARCHICO_COLLAPSIBLE_FALSE_TEST.ts4script
          if-no-files-found: error
