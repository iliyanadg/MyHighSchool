name: M48 one checkmark enrolls, X cancels (Python 3.7)
on:
  workflow_dispatch:
  push:
    paths:
      - 'src/m48_enrollment/mhs48_single_picker.py'
      - 'tooling/build_m48_single_checkmark.py'
      - 'tests/test_m48_one_step_enrollment.py'
      - 'tests/test_m45_visibility_complete.py'
      - '.github/workflows/m48-one-checkmark.yml'
      - 'src/m39_visibility/mhs39_visibility_ui.py'
      - 'src/m2_registry/mhs46_enrollment_transaction.py'
jobs:
  validate:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.7'
      - name: All offline tests including M45 baseline and M48 native picker callbacks
        run: python -m unittest discover -s tests -v
      - name: Package corrected M48 single-checkmark enrollment
        run: python -m tooling.build_m48_single_checkmark dist/
      - name: Audit package and bytecode
        run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile
          from tooling.simdata_release_gate import inspect_bytes
          p=Path('dist/MHS_M48_ISCRIZIONE_SPUNTA_UNICA_TEST.package')
          s=Path('dist/MHS_M48_ISCRIZIONE_SPUNTA_UNICA_TEST.ts4script')
          assert p.is_file() and s.is_file()
          report=inspect_bytes(p.read_bytes())
          assert report['status']=='STATIC_GATE_PASSED'
          assert report['category_count']==report['simdata_count']==5
          with zipfile.ZipFile(s) as z:
              assert len(z.namelist())==17
              assert all(z.read(n)[:4]==bytes((66,13,13,10)) for n in z.namelist())
          print('M48 one-step UI is structurally valid; first Mac test required')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: MHS_M48_ISCRIZIONE_SPUNTA_UNICA_MAC_TEST
          path: |
            dist/MHS_M48_ISCRIZIONE_SPUNTA_UNICA_TEST.package
            dist/MHS_M48_ISCRIZIONE_SPUNTA_UNICA_TEST.ts4script
          if-no-files-found: error
