name: M42 fix M41 runtime test exception and class menu (Python 3.7)
on:
  workflow_dispatch:
  push:
    paths:
      - 'tooling/build_m42_safe_menu.py'
      - 'src/m39_visibility/mhs39_visibility_ui.py'
      - 'src/m39_visibility/mhs39_visibility_rules.py'
      - 'tests/test_m42_safe_menu.py'
      - '.github/workflows/m42-safe-menu.yml'
jobs:
  test-build:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.7'
      - name: Python 3.7 regression suite (includes actual M41 crash case)
        run: python -m unittest discover -s tests -v
      - name: Build full M42 school menu
        run: python -m tooling.build_m42_safe_menu dist/
      - name: Validate package and actual Sims Python 3.7 bytecode
        run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile
          from tooling.simdata_release_gate import inspect_bytes
          p=Path('dist/MHS_M42_MENU_CORREZIONE_EXCEPTION_TEST.package')
          s=Path('dist/MHS_M42_MENU_CORREZIONE_EXCEPTION_TEST.ts4script')
          report=inspect_bytes(p.read_bytes())
          assert report['status']=='STATIC_GATE_PASSED'
          assert report['category_count']==5 and report['simdata_count']==5
          with zipfile.ZipFile(s) as z:
              names=z.namelist()
              assert len(names)==15
              assert all(z.read(name)[:4]==bytes((66,13,13,10)) for name in names)
          print('M42 regression gate passed. In-game nesting still unverified.')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: MHS_M42_CORRETTO_EXCEPTION_E_MENU_TEST
          path: |
            dist/MHS_M42_MENU_CORREZIONE_EXCEPTION_TEST.package
            dist/MHS_M42_MENU_CORREZIONE_EXCEPTION_TEST.ts4script
          if-no-files-found: error
