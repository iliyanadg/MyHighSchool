name: M130 physical classrooms and seats Mac diagnostic
on:
  push:
    branches:
      - feature/m55-presenze-studente-test
    paths:
      - 'src/m130_physical/**'
      - 'tests/test_m130_*.py'
      - 'tooling/build_mhs130_verified.py'
      - '.github/workflows/m130-physical-classroom-mac.yml'
  workflow_dispatch:
jobs:
  validate_build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.7'
      - name: Test physical classrooms plus earlier EA class/lesson regressions
        run: python -m unittest tests.test_m130_physical_seat_audit tests.test_m128_trait_alignment tests.test_m128_board_posture_audit tests.test_m127_school_timing_readback tests.test_m126_early_preparation_projection tests.test_m126_early_school_integration tests.test_m125_safe_recovery tests.test_m124_lesson_action_readback tests.test_m123_lesson_guest_projection tests.test_m121_thirteen_npc_trial tests.test_m122_classroom_job_readback -v
      - name: Build M130 Mac archive
        run: python -m tooling.build_mhs130_verified dist_m130
      - name: Verify actual M130 commands and Python 3.7 bytecode
        run: |
          python - <<'PY'
          from tooling.build_mhs130_verified import SOURCES,MAGIC,NAME
          from zipfile import ZipFile
          with ZipFile('dist_m130/'+NAME) as z:
              assert len(z.namelist()) == len(SOURCES) == 16
              assert all(z.read(f)[:4] == MAGIC for f in z.namelist())
              assert 'mhs130_classroom_controller.pyc' in z.namelist()
              assert 'mhs130_physical_seat_audit.pyc' in z.namelist()
              assert 'mhs128_classroom_controller.pyc' not in z.namelist()
              script=z.read('mhs130_classroom_controller.pyc')
              for name in ('mhs130.arm','mhs130.verifica','mhs130.allinea','mhs130.posti','mhs130.stop'):
                  assert name.encode('utf-8') in script,name
          print('M130 native physical-seat diagnostic commands and Mac archive verified')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: MHS_M130_PHYSICAL_SEATS_MAC_EXPERIMENTAL
          path: |
            dist_m130/MHS_M130_POSTI_AULE_MAC_BETA.ts4script
            dist_m130/M130_BUILD_REPORT.json
            dist_m130/LEGGIMI_M130.txt
          if-no-files-found: error
