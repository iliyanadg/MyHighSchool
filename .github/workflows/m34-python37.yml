name: M34 test register settings and optional class 3 (Python 3.7)
on:
  workflow_dispatch:
  push:
    paths:
      - "src/m34_settings/**"
      - "src/m2_registry/mhs34_settings.py"
      - "src/m2_registry/mhs_m2_store.py"
      - "tooling/build_m34_settings.py"
      - "tests/test_m34_settings.py"
      - ".github/workflows/m34-python37.yml"

jobs:
  test-and-build:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.7"
      - name: Full regression suite
        run: python -m unittest discover -s tests -v
      - name: Build M34 experimental package
        run: python -m tooling.build_m34_settings dist/
      - name: Verify resource inventory and Python 3.7 bytecode
        run: |
          python - <<'PY'
          from pathlib import Path
          from tooling.simdata_release_gate import resources, inspect_bytes
          import zipfile
          p=Path('dist/MHS_M34_IMPOSTAZIONI_REGISTRO_TEST.package')
          s=Path('dist/MHS_M34_IMPOSTAZIONI_REGISTRO_TEST.ts4script')
          report=inspect_bytes(p.read_bytes())
          assert len(resources(p.read_bytes()))==27
          assert report['status']=='STATIC_GATE_PASSED'
          assert report['category_count']==1 and report['simdata_count']==1
          with zipfile.ZipFile(str(s)) as z:
              assert len(z.namelist())==13
              assert all(z.read(x)[:4]==bytes((66,13,13,10)) for x in z.namelist())
          print('M34 passed static tests; does not yet control EA attendance or in-game pause')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: MHS_M34_IMPOSTAZIONI_SOLO_PARTITA_TEST
          path: |
            dist/MHS_M34_IMPOSTAZIONI_REGISTRO_TEST.package
            dist/MHS_M34_IMPOSTAZIONI_REGISTRO_TEST.ts4script
          if-no-files-found: error
