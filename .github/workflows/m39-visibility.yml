name: M39 dynamic school menu visibility (Python 3.7)
on:
  workflow_dispatch:
  push:
    paths:
      - "src/m39_visibility/**"
      - "tooling/build_m39_conditional_menu.py"
      - "tests/test_m39_conditional_menu.py"
      - ".github/workflows/m39-visibility.yml"

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.7"
      - name: Full test suite
        run: python -m unittest discover -s tests -v
      - name: Build conditional M39 package
        run: python -m tooling.build_m39_conditional_menu dist/
      - name: Check package and scripts
        run: |
          python - <<'PY'
          from pathlib import Path
          from tooling.simdata_release_gate import inspect_bytes
          import zipfile
          p=Path('dist/MHS_M39_CLASSI_DINAMICHE_TEST.package')
          s=Path('dist/MHS_M39_CLASSI_DINAMICHE_TEST.ts4script')
          check=inspect_bytes(p.read_bytes())
          assert check['status']=='STATIC_GATE_PASSED'
          assert check['category_count']==5 and check['simdata_count']==5
          with zipfile.ZipFile(s) as z:
              assert len(z.namelist())==15
              assert all(z.read(name)[:4]==bytes((66,13,13,10)) for name in z.namelist())
          print('M39 all static tests green; actual in-game dispatch unverified')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: MHS_M39_MENU_DINAMICO_NON_TESTATO
          path: |
            dist/MHS_M39_CLASSI_DINAMICHE_TEST.package
            dist/MHS_M39_CLASSI_DINAMICHE_TEST.ts4script
          if-no-files-found: error
