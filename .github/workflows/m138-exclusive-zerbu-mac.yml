name: M138 exclusive playable whiteboards Mac
on:
  push:
    branches: [feature/m55-presenze-studente-test]
    paths:
      - 'src/m138_zerbu_exclusive/**'
      - 'tests/test_m138_*.py'
      - 'tooling/build_mhs138_verified.py'
      - '.github/workflows/m138-exclusive-zerbu-mac.yml'
  workflow_dispatch:
jobs:
  validate_build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.7'
      - name: Offline school and exclusive whiteboard regression tests
        run: python -m unittest tests.test_m138_exclusive_whiteboard tests.test_m137_zerbu_board_compat tests.test_m136_player_test_hierarchy tests.test_m134_native_player_job_audit tests.test_m132_native_player_test_audit tests.test_m131_native_playable_class tests.test_m130_physical_seat_audit tests.test_m128_trait_alignment tests.test_m128_board_posture_audit tests.test_m127_school_timing_readback tests.test_m126_early_preparation_projection tests.test_m126_early_school_integration tests.test_m125_safe_recovery tests.test_m124_lesson_action_readback tests.test_m123_lesson_guest_projection tests.test_m121_thirteen_npc_trial tests.test_m122_classroom_job_readback -v
      - name: Build Mac compatible Python 3.7 archive
        run: python -m tooling.build_mhs138_verified dist_m138
      - name: Verify compiled native controller and safety patch
        run: |
          python - <<'PY'
          from tooling.build_mhs138_verified import SOURCES,MAGIC,NAME
          from zipfile import ZipFile
          with ZipFile('dist_m138/'+NAME) as z:
              assert len(z.namelist()) == len(SOURCES) == 21
              assert all(z.read(f)[:4] == MAGIC for f in z.namelist())
              assert 'mhs138_classroom_controller.pyc' in z.namelist()
              assert 'mhs138_exclusive_whiteboard.pyc' in z.namelist()
              assert 'mhs137_classroom_controller.pyc' not in z.namelist()
              script=z.read('mhs138_classroom_controller.pyc')
              for cmd in ('mhs138.arm','mhs138.compat','mhs138.sync','mhs138.stop'):
                  assert cmd.encode() in script,cmd
          print('M138 Mac exclusive playable whiteboard beta packaged; game behavior NOT verified')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: MHS_M138_EXCLUSIVE_PLAYABLE_BOARDS_MAC_EXPERIMENTAL
          path: |
            dist_m138/MHS_M138_ESCLUSIVE_LAVAGNE_GIOCABILI_MAC_BETA.ts4script
            dist_m138/M138_BUILD_REPORT.json
            dist_m138/LEGGIMI_M138.txt
          if-no-files-found: error
