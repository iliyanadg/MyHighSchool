name: M44 Lot51 category merge preflight (no user export yet)
on:
  workflow_dispatch:
  push:
    paths:
      - 'tooling/build_m44_tdesc_merge.py'
      - 'tests/test_m44_tdesc_merge.py'
      - '.github/workflows/m44-tdesc-preflight.yml'
jobs:
  tests:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.7'
      - name: Full offline regression suite
        run: python -m unittest discover -s tests -v
      - name: Verify regenerated references correct the original M43 bug
        run: |
          python - <<'PY'
          from tests.test_m44_tdesc_merge import exported_categories
          from tooling.build_m44_tdesc_merge import transform,M44BuildError
          try:
              transform(exported_categories(legacy_low_parent=True))
          except M44BuildError as e:
              assert 'parent mismatch' in str(e)
              print('PASS: reject original low-half hand-patched references')
          else:
              raise AssertionError('M43 low-half parent was incorrectly accepted')
          rows,changes=transform(exported_categories())
          assert len(rows)==35 and sum(x.startswith('simdata:') for x in changes)==4
          print('PASS: accept fresh TDesc high-half parent encoding')
          PY
