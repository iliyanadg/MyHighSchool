name: M45 menu visibility — preserve working M44 Lot51 nested categories
on:
  workflow_dispatch:
  push:
    paths:
      - 'tooling/build_m45_visibility_complete.py'
      - 'src/m39_visibility/mhs39_visibility_ui.py'
      - 'tests/test_m45_visibility_complete.py'
      - '.github/workflows/m45-visibility-complete.yml'
jobs:
  mac-game-test-build:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.7'
      - name: Complete test suite (including real M45 picker gating)
        run: python -m unittest discover -s tests -v
      - name: Compile M45 new behavior
        run: python -m tooling.build_m45_visibility_complete dist/
      - name: Verify two artifact files and correct Sims Python 3.7 bytecode
        run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile,hashlib
          from tooling.simdata_release_gate import inspect_bytes
          p=Path('dist/MHS_M45_MENU_VISIBILITA_CORRETTA_TEST.package')
          s=Path('dist/MHS_M45_MENU_VISIBILITA_CORRETTA_TEST.ts4script')
          info=inspect_bytes(p.read_bytes())
          assert info['status']=='STATIC_GATE_PASSED'
          assert info['category_count']==5 and info['simdata_count']==5
          with zipfile.ZipFile(s) as archive:
              names=archive.namelist()
              assert len(names)==15
              assert all(archive.read(name)[:4]==bytes((66,13,13,10)) for name in names)
          print('M45 archive verified; nested menu was proven on Mac with M44.')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: MHS_M45_MENU_VISIBILITA_2_3_CLASSI_TEST
          path: |
            dist/MHS_M45_MENU_VISIBILITA_CORRETTA_TEST.package
            dist/MHS_M45_MENU_VISIBILITA_CORRETTA_TEST.ts4script
          if-no-files-found: error
