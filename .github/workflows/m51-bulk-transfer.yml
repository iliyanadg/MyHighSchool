name: M51 transfer multiple students per class with single checkmark
on:
  workflow_dispatch:
  push:
    paths:
      - 'src/m32_transfer/mhs32_transfer_ui.py'
      - 'tooling/build_m51_bulk_transfer.py'
      - 'tests/test_m51_bulk_transfer.py'
      - '.github/workflows/m51-bulk-transfer.yml'
      - 'src/m48_enrollment/mhs48_single_picker.py'
      - 'src/m2_registry/mhs46_enrollment_transaction.py'
jobs:
  release:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.7'
      - name: All regression tests including actual M51 picker callbacks
        run: python -m unittest discover -s tests -v
      - name: Compile validated M51 transfer + filtered enrollment on M45 menu
        run: python -m tooling.build_m51_bulk_transfer dist/
      - name: Check package identity and 17 Python 3.7 script modules
        run: |
          python - <<'PY'
          import zipfile
          from pathlib import Path
          from tooling.build_m51_bulk_transfer import package_bytes
          from tooling.simdata_release_gate import inspect_bytes
          p=Path('dist/MHS_M51_ISCRIZIONI_E_TRASFERIMENTI_MULTIPLI_TEST.package')
          s=Path('dist/MHS_M51_ISCRIZIONI_E_TRASFERIMENTI_MULTIPLI_TEST.ts4script')
          assert p.read_bytes()==package_bytes()
          info=inspect_bytes(p.read_bytes())
          assert info['status']=='STATIC_GATE_PASSED'
          assert info['category_count']==info['simdata_count']==5
          with zipfile.ZipFile(s) as archive:
              assert len(archive.namelist())==17
              assert all(archive.read(n)[:4]==bytes((66,13,13,10))
                         for n in archive.namelist())
          print('M51 built, gameplay verification still required')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: MHS_M51_FILTRI_E_TRASFERIMENTI_MULTIPLI_MAC_TEST
          path: |
            dist/MHS_M51_ISCRIZIONI_E_TRASFERIMENTI_MULTIPLI_TEST.package
            dist/MHS_M51_ISCRIZIONI_E_TRASFERIMENTI_MULTIPLI_TEST.ts4script
          if-no-files-found: error
