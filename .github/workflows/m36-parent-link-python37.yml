name: M36 one nested Class 1 under MY HIGH SCHOOL
on:
  workflow_dispatch:
  push:
    paths:
      - "tooling/build_m36_nested_class1.py"
      - "tests/test_m36_nested_class1.py"
      - ".github/workflows/m36-parent-link-python37.yml"
jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.7"
      - name: Full regression suite
        run: python -m unittest discover -s tests -v
      - name: Compile M36 isolated nested category test
        run: python -m tooling.build_m36_nested_class1 dist/
      - name: Audit and verify compiled test scripts
        run: |
          python - <<'PY'
          import zipfile
          from pathlib import Path
          from tooling.simdata_release_gate import inspect_bytes,resources
          p=Path('dist/MHS_M36_CLASSE1_SOTTO_MENU_TEST.package')
          s=Path('dist/MHS_M36_CLASSE1_SOTTO_MENU_TEST.ts4script')
          x=inspect_bytes(p.read_bytes())
          assert x['status']=='STATIC_GATE_PASSED'
          assert x['category_count']==2 and x['simdata_count']==2
          assert len(resources(p.read_bytes()))==29
          with zipfile.ZipFile(s) as z:
              assert len(z.namelist())==13
              assert all(z.read(f)[:4]==bytes((66,13,13,10)) for f in z.namelist())
          print('M36 binary static checks passed; in-game parent remains unproven')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: MHS_M36_TEST_CLASSE1_DENTRO_MY_HIGH_SCHOOL
          path: |
            dist/MHS_M36_CLASSE1_SOTTO_MENU_TEST.package
            dist/MHS_M36_CLASSE1_SOTTO_MENU_TEST.ts4script
          if-no-files-found: error
